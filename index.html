<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinikum → BBZ Weimar</title>

<style>
  :root{
    --header-bg: #000000;
    --header-fg: #ffffff;
    --header-h: 60px;

    --bg: #ffffff;
    --ink: #000000;
    --line: #000000;

    --fs-base: 24px;
  }

  *{
    box-sizing: border-box;
  }

  html{
    font-size: var(--fs-base);
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
  }

  header{
    background:var(--header-bg);
    color:var(--header-fg);
    height:var(--header-h);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 1rem;
    text-align:center;
  }

  h1{
    margin:0;
    font-size:clamp(1.4rem, 4vw, 2.2rem);
    font-weight:800;
    letter-spacing:-0.01em;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:1.25rem 1.25rem 3rem;
  }

  details.settings{
    margin-bottom:1.25rem;
    border:2px solid var(--line);
  }

  details.settings summary{
    cursor:pointer;
    padding:.7rem 1rem;
    font-size:.95rem;
    list-style:none;
  }

  details.settings summary::-webkit-details-marker{
    display:none;
  }

  .settings-grid{
    padding:1rem;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:.9rem;
    border-top:2px solid var(--line);
  }

  .settings-grid label{
    display:flex;
    flex-direction:column;
    gap:.35rem;
    font-size:.8rem;
  }

  .settings-grid input[type=color]{
    width:100%;
    height:2.2rem;
    border:2px solid var(--line);
    padding:2px;
    background:var(--bg);
  }

  .settings-grid input[type=range]{
    width:100%;
  }

  table{
    width:100%;
    border-collapse:collapse;
    border:2px solid var(--line);
  }

  thead th{
    text-align:left;
    font-size:.95rem;
    padding:.7rem .8rem;
    border-bottom:2px solid var(--line);
  }

  tbody td{
    padding:.6rem .8rem;
    border-bottom:1px solid var(--line);
    font-size:1.05rem;
    font-variant-numeric:tabular-nums;
  }

  tbody tr:last-child td{
    border-bottom:none;
  }

  /* Highlight the next departure */
  tbody tr.next-departure{
    background:var(--ink);
    color:var(--bg);
  }

  .no-departures{
    text-align:center;
    padding:1rem;
  }
</style>

</head>

<body>

<header>
  <h1>Klinikum → BBZ Weimar</h1>
</header>

<div class="wrap">

  <details class="settings">
    <summary>Linie 5 Richtung STAUFFENBERGSTR</summary>

<div class="settings-grid">

  <label>
    Hintergrund
    <input type="color" id="ctl-bg" value="#ffffff">
  </label>

  <label>
    Text
    <input type="color" id="ctl-ink" value="#000000">
  </label>

  <label>
    Kopfleiste
    <input type="color" id="ctl-header-bg" value="#000000">
  </label>

  <label>
    Kopfleiste Höhe
    <input
      type="range"
      id="ctl-header-h"
      min="60"
      max="280"
      value="140"
    >
  </label>

  <label>
    Textgröße
    <input
      type="range"
      id="ctl-fs"
      min="14"
      max="30"
      value="18"
    >
  </label>

  <label>
    Anzahl Abfahrten
    <input
      type="range"
      id="ctl-count"
      min="1"
      max="20"
      value="8"
    >
  </label>

</div>

  </details>

  <table>

<thead>
  <tr>
    <th>Abfahrt</th>
    <th>Ankunft</th>
    <th>Fahrzeit</th>
  </tr>
</thead>

<tbody id="table-body"></tbody>

  </table>

</div>

<script>

  /* ======================================================
     FAHRPLAN
     Klinikum → BBZ Weimar
     ====================================================== */

  const OUT = [
    ["05:19","05:45"],
    ["05:49","06:10"],
    ["06:19","06:47"],
    ["06:48","07:12"],
    ["07:18","07:42"],
    ["07:48","08:12"],
    ["08:03","08:26"],
    ["08:18","08:42"],
    ["08:48","09:12"],
    ["09:18","09:42"],
    ["09:48","10:12"],
    ["10:03","10:26"],
    ["10:18","10:42"],
    ["10:48","11:12"],
    ["11:03","11:26"],
    ["11:18","11:42"],
    ["11:48","12:12"],
    ["12:03","12:26"],
    ["12:18","12:42"],
    ["12:48","13:12"],
    ["13:18","13:42"],
    ["13:48","14:12"],
    ["14:03","14:26"],
    ["14:18","14:42"],
    ["14:48","15:12"],
    ["15:18","15:42"],
    ["15:48","16:12"],
    ["16:03","16:26"],
    ["16:18","16:42"],
    ["16:48","17:12"],
    ["17:18","17:42"],
    ["17:48","18:12"],
    ["18:04","18:25"],
    ["18:18","18:40"],
    ["19:19","19:40"]
  ];


  /* ======================================================
     SETTINGS
     ====================================================== */

  let numberOfDepartures = 8;


  /* ======================================================
     TIME
     ====================================================== */

  function getBerlinTimeInMinutes(){

    const now = new Date();

    const formatter = new Intl.DateTimeFormat(
      "de-DE",
      {
        timeZone:"Europe/Berlin",
        hour:"2-digit",
        minute:"2-digit",
        hourCycle:"h23"
      }
    );

    const parts = formatter.formatToParts(now);

    const hour = Number(
      parts.find(p => p.type === "hour").value
    );

    const minute = Number(
      parts.find(p => p.type === "minute").value
    );

    return hour * 60 + minute;
  }


  function toMin(time){

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;
  }


  /* ======================================================
     RENDER NEXT DEPARTURES
     ====================================================== */

  function render(){

    const now = getBerlinTimeInMinutes();

    const upcoming = OUT
      .map(([dep,arr]) => ({
        dep,
        arr,
        depMin:toMin(dep),
        duration:toMin(arr) - toMin(dep)
      }))
      .filter(bus => bus.depMin >= now)
      .slice(0, numberOfDepartures);


    const tbody = document.getElementById("table-body");

    tbody.innerHTML = "";


    if(upcoming.length === 0){

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td colspan="3" class="no-departures">
          Keine weiteren Abfahrten heute
        </td>
      `;

      tbody.appendChild(tr);

      return;
    }


    upcoming.forEach((bus,index) => {

      const tr = document.createElement("tr");

      if(index === 0){
        tr.classList.add("next-departure");
      }

      tr.innerHTML = `
        <td>${bus.dep}</td>
        <td>${bus.arr}</td>
        <td>${bus.duration} Min</td>
      `;

      tbody.appendChild(tr);

    });

  }


  /* ======================================================
     SETTINGS CONTROLS
     ====================================================== */

  const root = document.documentElement.style;


  function bind(id,cssVar,unit=""){

    const el = document.getElementById(id);

    el.addEventListener("input",() => {

      root.setProperty(
        cssVar,
        el.value + unit
      );

    });

  }


  bind("ctl-bg","--bg");

  bind("ctl-ink","--ink");

  bind("ctl-header-bg","--header-bg");

  bind("ctl-header-h","--header-h","px");

  bind("ctl-fs","--fs-base","px");


  /* Number of departures */

  const countControl =
    document.getElementById("ctl-count");

  countControl.addEventListener("input",() => {

    numberOfDepartures =
      Number(countControl.value);

    render();

  });


  /* ======================================================
     INITIAL DISPLAY
     ====================================================== */

  render();


  /* ======================================================
     UPDATE AUTOMATICALLY
     ====================================================== */

  /*
     Re-check every 30 seconds so that when the next bus
     departs, it disappears and the next one moves up.
  */

  setInterval(render,30000);

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinikum → BBZ Weimar</title>

<style>

/* =========================================================
   =================== CUSTOMIZE HERE ======================
   ========================================================= */

/* ---------- COLORS ---------- */

:root{

  /* Main page */
  --bg-color: #FFFFFF;
  --text-color: #000000;

  /* Main header */
  --header-bg: #000000;
  --header-text: #FFFFFF;

  /* Table */
  --table-border: #000000;
  --table-header-bg: #FFFFFF;
  --table-header-text: #000000;
  --table-row-bg: #FFFFFF;
  --table-row-text: #000000;

  /* NEXT departure */
  --next-bg: #000000;
  --next-text: #FFFFFF;


  /* ---------- HEADER SIZES ---------- */

  /* Height of black header */
  --header-height: 70px;

  /* Main header text size */
  --header-text-size: 34px;


  /* ---------- PAGE SPACING ---------- */

  /* Space between header and table */
  --space-after-header: 8px;

  /* Left/right page spacing */
  --page-padding: 20px;

  /* Maximum table width */
  --max-width: 720px;


  /* ---------- TABLE TEXT SIZES ---------- */

  /* "Abfahrt / Ankunft / Fahrzeit" */
  --table-header-text-size: 20px;

  /* Departure / arrival / duration */
  --table-text-size: 24px;

  /* Date shown underneath tomorrow's departure */
  --next-day-text-size: 15px;


  /* ---------- TABLE SPACING ---------- */

  /* Height / vertical space inside table rows */
  --table-cell-padding-top: 10px;
  --table-cell-padding-bottom: 10px;

  /* Left/right space inside cells */
  --table-cell-padding-left: 12px;
  --table-cell-padding-right: 12px;


  /* ---------- TABLE BORDERS ---------- */

  /* Outer table border */
  --table-border-width: 2px;

  /* Row separator */
  --row-border-width: 1px;


  /* ---------- NUMBER OF DEPARTURES ---------- */

  /*
     Change this number to show more or fewer buses.

     Example:
     5  = next 5 buses
     8  = next 8 buses
     12 = next 12 buses
     20 = next 20 buses
  */

  --number-of-departures: 8;

}


/* =========================================================
   ================= END CUSTOMIZE HERE ====================
   ========================================================= */


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  padding:0;
}


body{
  background:var(--bg-color);
  color:var(--text-color);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-weight:700;
}


/* =========================================================
   HEADER
   ========================================================= */

header{

  background:var(--header-bg);
  color:var(--header-text);

  height:var(--header-height);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:0 10px;

}


h1{

  margin:0;

  font-size:var(--header-text-size);

  font-weight:800;

  line-height:1.1;

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.wrap{

  width:100%;

  max-width:var(--max-width);

  margin:0 auto;

  padding-left:var(--page-padding);

  padding-right:var(--page-padding);

  padding-top:var(--space-after-header);

  padding-bottom:20px;

}


/* =========================================================
   TABLE
   ========================================================= */

table{

  width:100%;

  border-collapse:collapse;

  border:
    var(--table-border-width)
    solid
    var(--table-border);

}


/* ---------- TABLE HEADER ---------- */

thead{

  background:var(--table-header-bg);

  color:var(--table-header-text);

}


thead th{

  text-align:left;

  font-size:var(--table-header-text-size);

  font-weight:800;

  padding-top:var(--table-cell-padding-top);

  padding-bottom:var(--table-cell-padding-bottom);

  padding-left:var(--table-cell-padding-left);

  padding-right:var(--table-cell-padding-right);

  border-bottom:
    var(--table-border-width)
    solid
    var(--table-border);

}


/* ---------- TABLE ROWS ---------- */

tbody{

  background:var(--table-row-bg);

  color:var(--table-row-text);

}


tbody td{

  padding-top:var(--table-cell-padding-top);

  padding-bottom:var(--table-cell-padding-bottom);

  padding-left:var(--table-cell-padding-left);

  padding-right:var(--table-cell-padding-right);

  border-bottom:
    var(--row-border-width)
    solid
    var(--table-border);

  font-size:var(--table-text-size);

  font-weight:700;

  font-variant-numeric:tabular-nums;

}


/* Remove final line */

tbody tr:last-child td{

  border-bottom:none;

}


/* =========================================================
   NEXT DEPARTURE
   ========================================================= */

tbody tr.next-departure{

  background:var(--next-bg);

  color:var(--next-text);

}


/* =========================================================
   TOMORROW / FOLLOWING DAY
   ========================================================= */

.next-day{

  font-size:var(--next-day-text-size);

  font-weight:700;

  line-height:1.1;

}


/* =========================================================
   NO DEPARTURES
   ========================================================= */

.no-departures{

  text-align:center;

  padding:
    var(--table-cell-padding-top)
    var(--table-cell-padding-left)
    var(--table-cell-padding-bottom)
    var(--table-cell-padding-right);

  font-size:var(--table-text-size);

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  :root{

    --header-text-size:28px;

    --table-header-text-size:17px;

    --table-text-size:20px;

    --next-day-text-size:13px;

    --page-padding:10px;

  }

}

</style>

</head>

<body>

<header>

  <h1>Klinikum → BBZ Weimar</h1>

</header>

<div class="wrap">

  <table>

<thead>

  <tr>

    <th>Abfahrt</th>

    <th>Ankunft</th>

    <th>Fahrzeit</th>

  </tr>

</thead>

<tbody id="table-body"></tbody>

  </table>

</div>

<script>

/* =========================================================
   FAHRPLAN
   Klinikum → BBZ Weimar
   ========================================================= */

const OUT = [

  ["05:19","05:45"],
  ["05:49","06:10"],
  ["06:19","06:47"],
  ["06:48","07:12"],

  ["07:18","07:42"],
  ["07:48","08:12"],

  ["08:03","08:26"],
  ["08:18","08:42"],
  ["08:48","09:12"],

  ["09:18","09:42"],
  ["09:48","10:12"],

  ["10:03","10:26"],
  ["10:18","10:42"],
  ["10:48","11:12"],

  ["11:03","11:26"],
  ["11:18","11:42"],
  ["11:48","12:12"],

  ["12:03","12:26"],
  ["12:18","12:42"],
  ["12:48","13:12"],

  ["13:18","13:42"],
  ["13:48","14:12"],

  ["14:03","14:26"],
  ["14:18","14:42"],
  ["14:48","15:12"],

  ["15:18","15:42"],
  ["15:48","16:12"],

  ["16:03","16:26"],
  ["16:18","16:42"],
  ["16:48","17:12"],

  ["17:18","17:42"],
  ["17:48","18:12"],

  ["18:04","18:25"],
  ["18:18","18:40"],

  ["19:19","19:40"]

];


/* =========================================================
   NUMBER OF DEPARTURES
   ========================================================= */

/*
   Change this number if you want a different amount.

   8 = eight upcoming buses
*/

let numberOfDepartures = 8;


/* =========================================================
   TIME CONVERSION
   ========================================================= */

function toMin(time){

  const [h,m] =
    time.split(":").map(Number);

  return h * 60 + m;

}


/* =========================================================
   CURRENT EUROPE / BERLIN DATE + TIME
   ========================================================= */

function getBerlinDateTime(){

  const now = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Europe/Berlin",

        year:"numeric",
        month:"2-digit",
        day:"2-digit",

        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",

        hourCycle:"h23"
      }
    );


  const parts =
    formatter.formatToParts(now);


  const get = type =>
    Number(
      parts.find(
        p => p.type === type
      ).value
    );


  return {

    year:get("year"),

    month:get("month"),

    day:get("day"),

    hour:get("hour"),

    minute:get("minute"),

    second:get("second")

  };

}


/* =========================================================
   DATE DISPLAY
   ========================================================= */

function formatDate(date){

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      timeZone:"Europe/Berlin",

      weekday:"short",

      day:"2-digit",

      month:"2-digit"
    }
  ).format(date);

}


/* =========================================================
   GET UPCOMING BUSES
   ========================================================= */

function getUpcomingDepartures(){

  const berlin =
    getBerlinDateTime();


  const nowMinutes =
    berlin.hour * 60 +
    berlin.minute;


  /*
     Create today's Berlin calendar date.
  */

  const today =
    new Date(
      berlin.year,
      berlin.month - 1,
      berlin.day
    );


  const result = [];


  /*
     Look through today and the next 30 days.

     This means that if there are only 4 buses
     remaining today, the remaining requested
     buses automatically come from tomorrow.
  */

  for(
    let dayOffset = 0;
    dayOffset < 30;
    dayOffset++
  ){

    if(
      result.length >=
      numberOfDepartures
    ){
      break;
    }


    const date =
      new Date(today);


    date.setDate(
      date.getDate() +
      dayOffset
    );


    const dateLabel =
      formatDate(date);


    OUT.forEach(
      ([dep,arr]) => {


        /*
           TODAY:

           Ignore buses that already departed.
        */

        if(
          dayOffset === 0 &&
          toMin(dep) < nowMinutes
        ){

          return;

        }


        /*
           Calculate journey duration.
        */

        const duration =
          toMin(arr) -
          toMin(dep);


        result.push({

          dep:dep,

          arr:arr,

          duration:duration,

          dayOffset:dayOffset,

          dateLabel:dateLabel

        });

      }
    );

  }


  return result.slice(
    0,
    numberOfDepartures
  );

}


/* =========================================================
   DISPLAY TABLE
   ========================================================= */

function render(){

  const tbody =
    document.getElementById(
      "table-body"
    );


  tbody.innerHTML = "";


  const upcoming =
    getUpcomingDepartures();


  if(
    upcoming.length === 0
  ){

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td
        colspan="3"
        class="no-departures"
      >
        Keine Abfahrten gefunden
      </td>

    `;


    tbody.appendChild(tr);

    return;

  }


  upcoming.forEach(
    (bus,index) => {

      const tr =
        document.createElement("tr");


      /*
         Highlight first upcoming bus.
      */

      if(index === 0){

        tr.classList.add(
          "next-departure"
        );

      }


      /*
         Show date when bus belongs
         to tomorrow or a later day.
      */

      let departureText =
        bus.dep;


      if(
        bus.dayOffset > 0
      ){

        departureText += `

          <div class="next-day">
            ${bus.dateLabel}
          </div>

        `;

      }


      tr.innerHTML = `

        <td>
          ${departureText}
        </td>

        <td>
          ${bus.arr}
        </td>

        <td>
          ${bus.duration} Min
        </td>

      `;


      tbody.appendChild(tr);

    }
  );

}


/* =========================================================
   START
   ========================================================= */

render();


/* =========================================================
   AUTOMATIC UPDATE
   ========================================================= */

/*
   Check every 30 seconds.

   When a bus's departure time has passed,
   it automatically disappears and the next
   bus moves into its place.
*/

setInterval(
  render,
  30000
);

</script>

</body>
</html>
